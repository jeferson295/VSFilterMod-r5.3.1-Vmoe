name: Build VSFilterMod

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.arch }} Release (MOD)
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            platform: x64
          - arch: x86
            platform: Win32

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Configure MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Build
        shell: cmd
        run: >-
          msbuild VSFilterMod.sln /m /t:Rebuild
          /p:Configuration="Release (MOD)"
          /p:Platform=${{ matrix.platform }}
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /v:minimal

      - name: Verify and collect DLL
        shell: pwsh
        run: |
          $source = "bin\${{ matrix.platform }}\VSFilter\Release (MOD)\VSFilterMod.dll"
          $destination = "dist\${{ matrix.arch }}\VSFilterMod.dll"
          if (-not (Test-Path -LiteralPath $source)) {
            throw "Build completed without producing $source"
          }
          New-Item -ItemType Directory -Force -Path (Split-Path $destination) | Out-Null
          Copy-Item -LiteralPath $source -Destination $destination
          Get-FileHash -LiteralPath $destination -Algorithm SHA256

      - name: Upload DLL
        uses: actions/upload-artifact@v4
        with:
          name: VSFilterMod-${{ matrix.arch }}
          path: dist/${{ matrix.arch }}/VSFilterMod.dll
          if-no-files-found: error

